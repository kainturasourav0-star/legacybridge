services:
  - type: web
    name: legacybridge-backend
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: legacybridge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: legacybridge-db
    databaseName: legacybridge
    user: legacybridge_user
    plan: starter
