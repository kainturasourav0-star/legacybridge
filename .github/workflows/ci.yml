name: LegacyBridge CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  fullstack-test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: |
          npm ci || npm install
      - name: Run ESLint
        run: |
          npm run lint
      - name: Run TypeScript Typecheck
        run: |
          npm run typecheck
      - name: Run Vitest Unit & Security Tests
        run: |
          npm test
      - name: Next.js Production Build
        run: |
          npm run build

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Pytest
        env:
          DEMO_MODE: "true"
          PYTHONPATH: "."
        run: |
          python -m pytest backend/tests -v
